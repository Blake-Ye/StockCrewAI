[project]
name = "stockcrewai"
version = "0.1.0"
description = "StockCrewAI using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.11,<2.0.0",
    "edgartools>=5.45.1,<6.0.0",
    "matplotlib>=3.10.9",
    "yfinance>=1.5.2",
]

[project.scripts]
kickoff = "stockcrewai.main:kickoff"
plot = "stockcrewai.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "6c1aee37-4f94-44ad-a09e-0b14f77906a9"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "pytest-xdist>=3,<4",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

# Rich/终端流模拟与 pytest 的 fd 捕获冲突，默认使用 sys capture。
[tool.pytest.ini_options]
addopts = ["--capture=sys"]
