# FinancialQualityAgent 的 Task 配置。
#
# 输入由 main.py 的 _financial_analysis_input 构造，输出会先经过
# AnalysisTaskOutput/AnalysisClaim 结构校验，再经过 Evidence ID 和
# Calculation ID 白名单校验。这里的 Prompt 只定义 Agent 的解释边界，
# 不能替代后续 Python Claim Gate 的确定性判定。
financial_quality_analysis_task:
  description: >-
    只使用 {financial_analysis_input} payload，忽略所有前序任务输出。只能解释输入中的财务 facts、Evidence 和 Calculation；不得检索、重新计算、修改输入数字或生成最终评级和买卖建议。若 financial_analysis_input 的 validated_evidence_ids 和 validated_calculation_ids 非空，且 facts/calculations 里有可解释内容，就不得返回空 claims；必须尽量输出 financial_quality 与 financial_trend 两类。每条 Claim 的 category 只能是 financial_quality 或 financial_trend，必须引用输入中的 Evidence ID 和 Calculation ID；每条 Claim 必须且只能包含 claim_id、category、statement、evidence_ids、calculation_ids、confidence 六个字段；confidence 必须是 0 到 1 之间的数字。字段白名单之外禁止额外字段，禁止添加 metric、value、domain、reason、status 或任何其他字段。JSON-only：只输出唯一的 claims JSON 对象，禁止 Markdown、代码围栏、limitations、warnings、免责声明以及 JSON 外的解释性文字；只有没有可解释的已验证事实时才允许 claims 数组为空。
  expected_output: >-
    JSON-only：只输出唯一 JSON 对象，示例为：{{"claims":[{{"claim_id":"claim_financial_quality_001","category":"financial_quality","statement":"营业利润率为 33.60%。","evidence_ids":["ev_operating_income","ev_revenue"],"calculation_ids":["calc_operating_margin"],"confidence":0.90}},{{"claim_id":"claim_financial_trend_001","category":"financial_trend","statement":"营业收入同比增长 16.15%。","evidence_ids":["ev_revenue_current","ev_revenue_prior"],"calculation_ids":["calc_revenue_growth"],"confidence":0.90}}]}}；实际输出必须只有该 JSON 对象，禁止 Markdown、代码围栏、limitations、warnings、免责声明、metric、value、domain、reason、status 以及任何 JSON 外文字段。
  agent: financial_quality_agent

# Risk Task 只允许引用可审计的 SEC filing Evidence，不执行财务计算。
risk_analysis_task:
  description: >-
    只使用 {risk_analysis_input} payload，忽略所有前序任务输出。只能解释输入中的 SEC filing 文本和元数据；不得检索、搜索互联网、添加文本中不存在的风险、预测未来或生成最终评级和买卖建议。如果 risk_analysis_input 的 validated_filing_ids 非空且 risk_sections 完整可见，就不得返回空 claims；必须尽量输出 risk Claim；只有没有完整风险文本时才可返回空 claims。每条 Claim 的 category 只能是 risk，必须引用 filing Evidence ID，evidence_ids 必须非空，calculation_ids 必须是空列表 []，即 calculation_ids 必须为空列表。每条 Claim 必须且只能包含 claim_id、category、statement、evidence_ids、calculation_ids、confidence 六个字段；confidence 必须是 0 到 1 之间的数字。字段白名单之外禁止额外字段，禁止添加 metric、value、domain、reason、status 或任何其他字段。JSON-only：只输出唯一的 claims JSON 对象，禁止 Markdown、代码围栏、limitations、warnings、免责声明以及 JSON 外的解释性文字。
  expected_output: >-
    JSON-only：只输出唯一 JSON 对象，示例为：{{"claims":[{{"claim_id":"claim_risk_001","category":"risk","statement":"申报文本披露供应链风险。","evidence_ids":["ev_filing"],"calculation_ids":[],"confidence":0.90}}]}}；实际输出必须只有该 JSON 对象；没有完整风险文本时唯一允许的空输出是 {{"claims":[]}}；禁止 Markdown、代码围栏、limitations、warnings、免责声明、metric、value、domain、reason、status 以及任何 JSON 外文字段。
  agent: risk_analysis_agent
